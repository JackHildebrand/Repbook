name: Native iOS
on:
  push:
    branches: [native-ios, main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test core models and backup migration
        working-directory: ios
        run: swift test
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build simulator app and widget extension
        working-directory: ios
        run: xcodebuild -project Repbook.xcodeproj -scheme Repbook -sdk iphonesimulator -configuration Debug -derivedDataPath build-simulator CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned device app
        working-directory: ios
        run: xcodebuild -project Repbook.xcodeproj -scheme Repbook -sdk iphoneos -configuration Release -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build
      - name: Package for local signing
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/Repbook.app Payload/
          zip -r Repbook-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Repbook-unsigned
          path: ios/Repbook-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Repbook-Xcode-project
          path: |
            ios/Repbook.xcodeproj
            ios/Repbook
            ios/Shared
            ios/Widgets
