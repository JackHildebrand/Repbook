<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1019"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Repbook"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg">
<title>Repbook</title>
<style>
:root{color-scheme:dark;--bg:#0b1019;--panel:#151d2b;--line:#2b394d;--text:#f5f7fb;--muted:#95a4bb;--accent:#9ba8ff;--good:#5de0b2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:calc(24px + env(safe-area-inset-top, 0px)) 16px calc(105px + env(safe-area-inset-bottom, 0px))}header,.row,.between{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}h1{margin:0;font-size:32px}h2{font-size:21px}.muted{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;margin:10px 0}.btn{border:1px solid var(--line);background:#1a2535;color:var(--text);border-radius:11px;padding:10px 13px;font-weight:700}.btn.primary{background:var(--accent);color:#0b1020}.btn.danger{color:#ff8f9d}.full{width:100%}input,textarea{width:100%;background:#0f1725;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}.nav{position:fixed;bottom:0;left:0;right:0;background:#111827ee;border-top:1px solid var(--line);display:flex;padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:10}.nav button{flex:1;background:transparent;border:0;color:var(--muted);padding:8px 3px}.nav button.active{color:var(--accent)}.set{display:grid;grid-template-columns:32px 1fr 1fr 38px;gap:7px;align-items:center;margin:7px 0}.set input{text-align:center}.pill{font-size:11px;background:#303965;padding:4px 8px;border-radius:999px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#1a2535;padding:12px;border-radius:12px}.stat b{display:block;font-size:22px}.hidden{display:none}.modal{position:fixed;inset:0;background:#030712dc;z-index:30;display:flex;align-items:center;justify-content:center;padding:14px}.dialog{width:min(100%,620px);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.modal.hidden{display:none}input,textarea,select{font-size:16px}button,a,input{touch-action:manipulation}
</style>
</head>
<body><main class="app"><div id="page"></div></main>
<nav class="nav"><button data-tab="workout" class="active" onclick="go('workout')">＋<br>Workout</button><button data-tab="history" onclick="go('history')">▥<br>History & Progress</button></nav>
<div id="modal" class="modal hidden"><div id="dialog" class="dialog"></div></div>
<script>
const KEY='repbook-v1',uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names=['Bench Press (Barbell)','Chest Press (Machine)','Chest Fly (Machine)','Shoulder Press (Machine)','Lateral Raise (Machine)','Lat Pulldown (Cable)','Seated Row (Machine)','Preacher Curl (Machine)','Bicep Curl (Dumbbell)','Triceps Pushdown (Cable)','Squat (Barbell)','Leg Press (Machine)','Leg Extension (Machine)','Seated Leg Curl (Machine)','Romanian Deadlift (Barbell)','Calf Extension (Machine)','Crunch (Machine)'];
const seed=()=>{const exercises=names.map(name=>({id:uid(),name})),id=n=>exercises.find(e=>e.name===n)?.id;return {unit:'lbs',exercises,routines:[{id:uid(),name:'Upper',exerciseIds:['Chest Press (Machine)','Lat Pulldown (Cable)','Chest Fly (Machine)','Seated Row (Machine)','Lateral Raise (Machine)','Preacher Curl (Machine)','Triceps Pushdown (Cable)'].map(id).filter(Boolean)},{id:uid(),name:'Lower',exerciseIds:['Leg Extension (Machine)','Seated Leg Curl (Machine)','Leg Press (Machine)','Calf Extension (Machine)','Crunch (Machine)'].map(id).filter(Boolean)}],workouts:[],active:null}};
let s;try{s=JSON.parse(localStorage.getItem(KEY))||seed()}catch{s=seed()}let tab='workout';const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem(KEY,JSON.stringify(s)),ex=id=>s.exercises.find(x=>x.id===id)||{name:'Unknown'},sets=w=>w.exercises.reduce((n,e)=>n+e.sets.length,0),vol=w=>w.exercises.reduce((n,e)=>n+e.sets.reduce((a,x)=>a+(+x.weight||0)*(+x.reps||0),0),0);
function go(t){tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function modal(x){$('dialog').innerHTML=x;$('modal').classList.remove('hidden')}function closeM(){$('modal').classList.add('hidden')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeM()};
function render(){$('page').innerHTML=tab==='workout'?workout():progress()+history()}
function workout(){if(s.active)return active();return `<div class="between"><h2>Your routines</h2><div class="row"><button class="btn" onclick="routine()">＋ New</button><button class="btn" aria-label="Settings" onclick="settings()">⚙</button></div></div>${s.routines.length?s.routines.map(r=>`<div class="card between"><div><b>${esc(r.name)}</b><div class="muted">${r.exerciseIds.length} exercises</div></div><div class="row"><button class="btn" onclick="routine('${r.id}')">Edit</button><button class="btn primary" onclick="start('${r.id}')">Start</button></div></div>`).join(''):'<div class="card muted">No routines yet.</div>'}`}

let routineDraft=null;
function routine(id){const r=s.routines.find(x=>x.id===id);routineDraft={id:r?.id||null,name:r?.name||'',exerciseIds:[...(r?.exerciseIds||[])],templates:JSON.parse(JSON.stringify(r?.templates||{}))};drawRoutine()}
function drawRoutine(){const d=routineDraft;modal(`<div class="between"><h2>${d.id?'Edit routine':'New routine'}</h2><button class="btn" onclick="closeM()">Cancel</button></div><input id="rn" aria-label="Routine name" placeholder="Routine name" value="${esc(d.name)}" oninput="routineDraft.name=this.value" style="margin-top:12px"><h3 style="margin-top:20px">Exercises in order</h3>${d.exerciseIds.map((id,i)=>`<div class="card"><div class="between"><b>${esc(ex(id).name)}</b><div class="row"><button class="btn" aria-label="Move exercise up" ${i===0?'disabled':''} onclick="moveRoutine(${i},-1)">↑</button><button class="btn" aria-label="Move exercise down" ${i===d.exerciseIds.length-1?'disabled':''} onclick="moveRoutine(${i},1)">↓</button><button class="btn danger" aria-label="Remove exercise" onclick="routineDraft.exerciseIds.splice(${i},1);drawRoutine()">×</button></div></div><div class="set muted" style="font-size:12px"><span>Set</span><span style="text-align:center">${s.unit}</span><span style="text-align:center">Reps</span><span></span></div>${routineSets(id).map((x,si)=>`<div class="set"><b>${si+1}</b><input aria-label="${esc(ex(id).name)} set ${si+1} weight" inputmode="decimal" type="number" min="0" step="any" placeholder="Optional" value="${esc(x.weight)}" oninput="routineDraft.templates[\'${id}\'][${si}].weight=this.value"><input aria-label="${esc(ex(id).name)} set ${si+1} reps" inputmode="numeric" type="number" min="1" step="1" placeholder="Reps" value="${esc(x.reps)}" oninput="routineDraft.templates[\'${id}\'][${si}].reps=this.value"><button class="btn danger" aria-label="Remove set" ${routineSets(id).length===1?'disabled':''} onclick="routineSets(\'${id}\').splice(${si},1);drawRoutine()">−</button></div>`).join('')}<button class="btn full" onclick="addRoutineSet(\'${id}\')">＋ Add set</button></div>`).join('')||'<p class="muted">Add exercises below.</p>'}<h3 style="margin-top:20px">Add exercises</h3><div style="margin:12px 0">${s.exercises.filter(e=>!d.exerciseIds.includes(e.id)).map(e=>`<div class="between" style="padding:8px 0"><span>${esc(e.name)}</span><button class="btn" onclick="routineDraft.exerciseIds.push('${e.id}');drawRoutine()">＋</button></div>`).join('')}</div><button class="btn primary full" onclick="saveRoutine()">Save routine</button>`)}
function routineSets(id){return routineDraft.templates[id]||(routineDraft.templates[id]=[{weight:'',reps:''}])}
function addRoutineSet(id){const a=routineSets(id),prev=a.at(-1)||{};a.push({weight:prev.weight||'',reps:prev.reps||''});drawRoutine()}
function moveRoutine(i,delta){const a=routineDraft.exerciseIds,j=i+delta;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];drawRoutine()}
function saveRoutine(){const d=routineDraft,name=d.name.trim();if(!name)return alert('Enter a routine name.');if(!d.exerciseIds.length)return alert('Add at least one exercise.');for(const id of d.exerciseIds)for(const x of routineSets(id)){if(x.weight!==''&&(!Number.isFinite(+x.weight)||+x.weight<0))return alert('Weights must be zero or higher.');if(x.reps!==''&&(!Number.isInteger(+x.reps)||+x.reps<1))return alert('Reps must be a whole number above zero.')}const templates=Object.fromEntries(d.exerciseIds.map(id=>[id,routineSets(id).map(x=>({weight:x.weight,reps:x.reps}))]));const existing=s.routines.find(r=>r.id===d.id);if(existing){existing.name=name;existing.exerciseIds=[...d.exerciseIds];existing.templates=templates}else s.routines.push({id:uid(),name,exerciseIds:[...d.exerciseIds],templates});save();closeM();render()}
function start(id){if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});const r=s.routines.find(x=>x.id===id);s.active={id:uid(),name:r?.name||'Workout',start:new Date().toISOString(),exercises:(r?.exerciseIds||[]).map(exerciseId=>({exerciseId,sets:(r.templates?.[exerciseId]?.length?r.templates[exerciseId]:[{weight:'',reps:''}]).map(x=>({id:uid(),weight:x.weight??'',reps:x.reps??'',done:false}))}))};save();render()}
function active(){const w=s.active;return `<div class="between"><input style="font-size:20px;font-weight:700" value="${esc(w.name)}" oninput="s.active.name=this.value;save()"><button class="btn primary" onclick="finish()">Finish</button></div>${w.exercises.map((e,ei)=>`<div class="card"><div class="between"><b>${esc(ex(e.exerciseId).name)}</b><button class="btn danger" onclick="s.active.exercises.splice(${ei},1);save();render()">×</button></div>${e.sets.map((x,si)=>`<div class="set"><span>${si+1}</span><input type="number" placeholder="${s.unit}" value="${x.weight}" oninput="upd(${ei},${si},'weight',this.value)"><input type="number" placeholder="reps" value="${x.reps}" oninput="upd(${ei},${si},'reps',this.value)"><button class="btn" onclick="s.active.exercises[${ei}].sets.splice(${si},1);save();render()">−</button></div>`).join('')}<button class="btn full" onclick="addSet(${ei})">＋ Add set</button></div>`).join('')}<button class="btn full" onclick="pickExercise()">＋ Add exercise</button><button class="btn danger full" style="margin-top:10px" onclick="if(confirm('Discard workout?')){s.active=null;save();render()}">Discard</button>`}
function upd(e,i,k,v){s.active.exercises[e].sets[i][k]=v;save()}function addSet(e){const prev=s.active.exercises[e].sets.at(-1)||{};s.active.exercises[e].sets.push({id:uid(),weight:prev.weight||'',reps:prev.reps||'',done:false});save();render()}
function pickExercise(){modal(`<h2>Add exercise</h2><input id="q" placeholder="Search" oninput="drawPick(this.value)"><div id="pick"></div>`);drawPick('')}
function drawPick(q){$('pick').innerHTML=s.exercises.filter(e=>e.name.toLowerCase().includes(q.toLowerCase())).map(e=>`<div class="between" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${esc(e.name)}</span><button class="btn" onclick="s.active.exercises.push({exerciseId:'${e.id}',sets:[{id:uid(),weight:'',reps:'',done:false}]});save();closeM();render()">Add</button></div>`).join('')}
function finish(){if(!s.active.exercises.length)return alert('Add at least one exercise.');s.active.end=new Date().toISOString();s.workouts.push(s.active);s.active=null;save();render()}
function history(){return `<div class="between" style="margin-top:28px"><h2>Workout history</h2><span class="pill">${s.workouts.length}</span></div>${s.workouts.length?s.workouts.slice().reverse().map(w=>`<div class="card between"><div><b>${esc(w.name)}</b><div class="muted">${new Date(w.start).toLocaleDateString()} · ${sets(w)} sets</div></div><button class="btn" onclick="view('${w.id}')">View</button></div>`).join(''):'<div class="card muted">No workouts yet. Import Hevy history in Settings.</div>'}`}
function view(id){const w=s.workouts.find(x=>x.id===id);modal(`<h2>${esc(w.name)}</h2><p class="muted">${new Date(w.start).toLocaleString()}</p>${w.exercises.map(e=>`<div class="card"><b>${esc(ex(e.exerciseId).name)}</b>${e.sets.map((x,i)=>`<div class="between" style="padding:7px 0"><span>Set ${i+1}</span><b>${x.weight||'—'} × ${x.reps||'—'}</b></div>`).join('')}</div>`).join('')}<button class="btn danger full" onclick="s.workouts=s.workouts.filter(x=>x.id!=='${w.id}');save();closeM();render()">Delete workout</button>`)}
function best(id){return Math.max(0,...s.workouts.flatMap(w=>w.exercises.filter(e=>e.exerciseId===id).flatMap(e=>e.sets.map(x=>+x.weight||0))))}
function exercises(){return `<div class="between"><h2>Exercise library</h2><button class="btn" onclick="newEx()">＋ New</button></div>${s.exercises.sort((a,b)=>a.name.localeCompare(b.name)).map(e=>`<div class="between" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><b>${esc(e.name)}</b><div class="muted">Best: ${best(e.id)||'—'} ${s.unit}</div></div></div>`).join('')}`}
function newEx(){const name=prompt('Exercise name');if(name?.trim()){s.exercises.push({id:uid(),name:name.trim()});save();render()}}
function progress(){const total=s.workouts.reduce((n,w)=>n+sets(w),0),volume=s.workouts.reduce((n,w)=>n+vol(w),0);return `<h2>Your progress</h2><div class="statgrid"><div class="stat"><b>${s.workouts.length}</b><span>Workouts</span></div><div class="stat"><b>${total}</b><span>Sets</span></div><div class="stat"><b>${Math.round(volume).toLocaleString()}</b><span>${s.unit} volume</span></div></div>${exerciseTrends()}<h2>Records</h2>${s.exercises.filter(e=>best(e.id)).sort((a,b)=>best(b.id)-best(a.id)).map(e=>`<div class="between" style="padding:11px 0;border-bottom:1px solid var(--line)"><span>${esc(e.name)}</span><b style="color:var(--good)">${best(e.id)} ${s.unit}</b></div>`).join('')||'<p class="muted">No records yet.</p>'}`}

let trendRange='2',trendMetric='weight';
function setTrend(k,v){if(k==='range')trendRange=v;else trendMetric=v;render()}
function showTrendPoint(el){const chart=el.closest('.card');chart.querySelector('.trend-detail').textContent=el.getAttribute('data-detail');chart.querySelectorAll('circle').forEach(p=>p.setAttribute('fill',p===el?'#5de0b2':'#9ba8ff'))}
function exerciseTrends(){
 const end=new Date(),cutoff=new Date(end);cutoff.setMonth(cutoff.getMonth()-Number(trendRange||0));cutoff.setHours(0,0,0,0);
 const visible=s.workouts.filter(w=>new Date(w.start)<=end&&(trendRange==='all'||new Date(w.start)>=cutoff));
 const unit=trendMetric==='reps'?'reps':trendMetric==='volume'?s.unit+' volume':s.unit;

 const ranked=s.exercises.map(e=>({e,uses:visible.filter(w=>w.exercises.some(x=>x.exerciseId===e.id)).length})).filter(x=>x.uses).sort((a,b)=>b.uses-a.uses||a.e.name.localeCompare(b.e.name)).slice(0,6);
 return '<section style="margin-top:28px"><h2>Exercise progress</h2><p class="muted">Your six most-used exercises in this period. Tap a point for details.</p><div class="row" style="margin-bottom:16px"><label style="flex:1">Date range<select aria-label="Graph date range" onchange="setTrend(\'range\',this.value)" style="width:100%;margin-top:6px">'+[['1','Past month'],['2','Past 2 months'],['3','Past 3 months'],['6','Past 6 months'],['all','All time']].map(([v,l])=>'<option value="'+v+'" '+(trendRange===v?'selected':'')+'>'+l+'</option>').join('')+'</select></label><label style="flex:1">Metric<select aria-label="Graph metric" onchange="setTrend(\'metric\',this.value)" style="width:100%;margin-top:6px">'+[['weight','Top weight'],['reps','Total reps'],['volume','Volume']].map(([v,l])=>'<option value="'+v+'" '+(trendMetric===v?'selected':'')+'>'+l+'</option>').join('')+'</select></label></div>'+ (ranked.length?ranked.map(({e,uses})=>{
 const points=visible.map(w=>({date:new Date(w.start),values:w.exercises.filter(x=>x.exerciseId===e.id).flatMap(x=>x.sets).filter(x=>Number.isFinite(+x.reps)&&+x.reps>0&&(trendMetric==='reps'||(x.weight!==''&&x.weight!=null&&Number.isFinite(+x.weight)&&+x.weight>=0))).map(x=>trendMetric==='reps'?+x.reps:trendMetric==='volume'?+x.weight*+x.reps:+x.weight)})).filter(p=>p.values.length&&Number.isFinite(+p.date)).map(p=>({date:p.date,value:trendMetric==='weight'?Math.max(...p.values):p.values.reduce((a,b)=>a+b,0)})).sort((a,b)=>a.date-b.date);
 if(!points.length)return '<div class="card"><b>'+esc(e.name)+'</b><p class="muted">No weighted sets logged yet.</p></div>';
 const W=360,H=170,L=43,R=16,T=18,B=32,minT=trendRange==='all'?+points[0].date:+cutoff,maxT=trendRange==='all'?+points.at(-1).date:+end,maxV=Math.max(1,...points.map(p=>p.value))*1.1;
 const x=p=>minT===maxT?(L+W-R)/2:L+(+p.date-minT)/(maxT-minT)*(W-L-R),y=v=>H-B-v/maxV*(H-T-B),date=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'}),fmt=v=>Number(v.toFixed(1)).toLocaleString();
 const grid=[0,.5,1].map(f=>{const v=maxV*f,yy=y(v);return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="#2b394d"/><text x="'+(L-7)+'" y="'+(yy+4)+'" text-anchor="end" fill="#95a4bb" font-size="10">'+fmt(v)+'</text>'}).join('');
 const line=points.map(p=>x(p)+','+y(p.value)).join(' ');
 const dots=points.map(p=>'<circle cx="'+x(p)+'" cy="'+y(p.value)+'" r="6" fill="#9ba8ff" tabindex="0" role="button" onclick="showTrendPoint(this)" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();showTrendPoint(this)}" data-detail="'+esc(p.date.toLocaleDateString()+': '+fmt(p.value)+' '+unit)+'" aria-label="'+esc(p.date.toLocaleDateString()+': '+fmt(p.value)+' '+unit)+'"><title>'+esc(p.date.toLocaleDateString()+': '+fmt(p.value)+' '+unit)+'</title></circle>').join('');
 return '<div class="card"><div class="between"><b>'+esc(e.name)+'</b><span class="muted">'+uses+' workouts</span></div><p class="muted" style="margin:6px 0">Latest: '+fmt(points.at(-1).value)+' '+unit+' · Best: '+fmt(Math.max(...points.map(p=>p.value)))+' '+unit+'</p><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(e.name+' '+trendMetric+' over time in '+unit)+'" style="width:100%;display:block">'+grid+'<polyline points="'+line+'" fill="none" stroke="#9ba8ff" stroke-width="2.5" stroke-linejoin="round"/>'+dots+'<text x="'+L+'" y="'+(H-8)+'" fill="#95a4bb" font-size="10">'+date(new Date(minT))+'</text>'+(points.length>1?'<text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" fill="#95a4bb" font-size="10">'+date(new Date(maxT))+'</text>':'')+'</svg><p class="trend-detail muted" aria-live="polite" style="font-size:13px;min-height:20px;margin:8px 0 0">Tap a point to see the date and value.</p>'+(points.length===1?'<p class="muted" style="font-size:12px;margin-bottom:0">Log another workout to see a trend.</p>':'')+'</div>';
 }).join(''):'<div class="card muted">No workouts in this period. Choose a wider date range, finish a workout, or import your Hevy CSV in Settings.</div>')+'</section>';
}

function settings(){modal(`<h2>Settings & data</h2><div class="card"><b>Import Hevy CSV</b><p class="muted">Imports title, timestamps, exercises, sets, weights, reps, notes and set types.</p><input type="file" accept=".csv,text/csv" onchange="importHevy(this.files[0])"></div><div class="card"><b>Backup</b><div class="row" style="margin-top:10px"><button class="btn" onclick="backup()">Export JSON</button><label class="btn">Import JSON<input type="file" accept=".json" style="display:none" onchange="restore(this.files[0])"></label></div></div><button class="btn full" onclick="s.unit=s.unit==='lbs'?'kg':'lbs';save();closeM();render()">Units: ${s.unit}</button><button class="btn danger full" style="margin-top:10px" onclick="if(confirm('Delete all Repbook data?')){s=seed();save();closeM();render()}">Reset all data</button>`)}
function csv(t){const out=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);if(r.some(Boolean))out.push(r);r=[];f=''}else f+=c}r.push(f);if(r.some(Boolean))out.push(r);return out}
async function importHevy(file){if(!file)return;try{const rows=csv(await file.text()),head=rows.shift().map(x=>x.replace(/^\ufeff/,'').trim()),idx=k=>head.indexOf(k);for(const k of ['title','start_time','exercise_title','weight_lbs','reps'])if(idx(k)<0)throw Error('Missing '+k);const map=new Map;for(const r of rows){const title=r[idx('title')],start=r[idx('start_time')],name=r[idx('exercise_title')];if(!name||!start)continue;const key=title+'|'+start;let w=map.get(key);if(!w){w={id:uid(),name:title||'Workout',start:new Date(start.replace(/^(\d{1,2}) ([A-Za-z]{3}) (\d{4}), (\d{1,2}):(\d{2})$/,'$2 $1, $3 $4:$5')).toISOString(),end:null,exercises:[],source:'hevy',importKey:key};map.set(key,w)}let ee=s.exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!ee){ee={id:uid(),name};s.exercises.push(ee)}let we=w.exercises.find(x=>x.exerciseId===ee.id);if(!we){we={exerciseId:ee.id,notes:idx('exercise_notes')>=0?r[idx('exercise_notes')]:'',sets:[]};w.exercises.push(we)}we.sets.push({id:uid(),weight:r[idx('weight_lbs')],reps:r[idx('reps')],type:idx('set_type')>=0?r[idx('set_type')]:'normal',done:true})}const existing=new Set(s.workouts.map(w=>w.importKey));let n=0;for(const [k,w] of map)if(!existing.has(k)){s.workouts.push(w);n++}s.workouts.sort((a,b)=>new Date(a.start)-new Date(b.start));save();closeM();render();alert('Imported '+n+' workouts.')}catch(e){alert('Import failed: '+e.message)}}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='repbook-backup.json';a.click()}
async function restore(file){if(!file)return;try{const d=JSON.parse(await file.text());if(!d.workouts||!d.exercises)throw Error('Not a Repbook backup');s=d;save();closeM();render()}catch(e){alert(e.message)}}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
