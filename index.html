function beginSetSwipe(event,ei,si){if(event.touches.length!==1){setSwipe=null;return}const t=event.touches[0],row=event.currentTarget;document.querySelectorAll('[data-set-row]').forEach(el=>{if(el!==row){el.style.transform='';el.closest('.swipe-shell')?.classList.remove('revealed')}});setSwipe={x:t.clientX,y:t.clientY,ei,si,row,moved:false,axis:null,offset:row.closest('.swipe-shell').classList.contains('revealed')?-84:0};row.style.transition='none'}
function moveSetSwipe(event){const p=setSwipe;if(!p||event.touches.length!==1)return;const t=event.touches[0],dx=t.clientX-p.x,dy=t.clientY-p.y;if(Math.max(Math.abs(dx),Math.abs(dy))>8){p.moved=true;setTapBlockedUntil=Date.now()+450;if(!p.axis)p.axis=Math.abs(dx)>Math.abs(dy)*1.3?'x':'y'}if(p.axis==='x'){if(event.cancelable)event.preventDefault();const offset=Math.max(-p.row.clientWidth,Math.min(0,p.offset+dx));p.row.style.transform='translateX('+offset+'px)';p.row.closest('.swipe-shell').classList.toggle('swiping',offset<0)}}
function endSetSwipe(event){const p=setSwipe;setSwipe=null;if(!p)return;p.row.style.transition='transform .2s ease';if(p.moved){setTapBlockedUntil=Date.now()+450;if(p.axis==='x'&&event.cancelable)event.preventDefault()}const shell=p.row.closest('.swipe-shell');shell.classList.remove('swiping');if(p.axis!=='x'){p.row.style.transform=p.offset?'translateX(-84px)':'';return}const t=event.changedTouches[0],offset=p.offset+t.clientX-p.x;if(offset< -Math.max(150,p.row.clientWidth*.62)){p.row.style.transform='translateX(-100%)';setTimeout(()=>deleteWorkoutSet(p.ei,p.si),160)}else if(offset< -40){p.row.style.transform='translateX(-84px)';shell.classList.add('revealed')}else{p.row.style.transform='';shell.classList.remove('revealed')}}
function cancelSetSwipe(){const p=setSwipe;setSwipe=null;if(p){setTapBlockedUntil=Date.now()+450;p.row.style.transition='transform .2s ease';p.row.style.transform=p.offset?'translateX(-84px)':'';p.row.closest('.swipe-shell').classList.remove('swiping')}}
function deleteWorkoutSet(ei,si){if(!s.active?.exercises[ei]?.sets[si])return;const e=s.active.exercises[ei],warm=isWarmup(e.sets[si]);e.sets.splice(si,1);if(warm)changeActiveWarmups(ei,e.sets.filter(isWarmup).length);else{save();render()}feedback('Set removed')}
function logSet(e,i,done){if(Date.now()<setTapBlockedUntil){render();return}const x=s.active.exercises[e].sets[i];if(done){if(x.weight==='')x.weight=x.previousWeight??'';if(x.reps==='')x.reps=x.previousReps??''}if(done&&(!Number.isInteger(+x.reps)||+x.reps<1||x.weight!==''&&(!Number.isFinite(+x.weight)||+x.weight<0))){render();feedback('Enter valid reps and weight first');return}x.done=done;x.pr=done&&setPR(e,i);x.volumePR=done&&setPR(e,i,'volume');save();if(done)haptic(x.volumePR?'pr':'set');render()}
function upd(e,i,k,v){s.active.exercises[e].sets[i][k]=v;s.active.exercises[e].sets[i].pr=setPR(e,i);s.active.exercises[e].sets[i].volumePR=setPR(e,i,'volume');save()}function addSet(e){const prev=s.active.exercises[e].sets.filter(x=>!isWarmup(x)).at(-1)||{};s.active.exercises[e].sets.push({id:uid(),weight:'',reps:'',previousWeight:prev.weight!==''?prev.weight:(prev.previousWeight??''),previousReps:prev.reps!==''?prev.reps:(prev.previousReps??''),done:false});save();render()}
function pickExercise(){modal(`<h2>Add exercise</h2><input id="q" placeholder="Search" oninput="drawPick(this.value)"><div id="pick"></div>`);drawPick('')}
function drawPick(q){$('pick').innerHTML=s.exercises.filter(e=>e.name.toLowerCase().includes(q.toLowerCase())).map(e=>`<div class="between" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${esc(e.name)}</span><button class="btn" onclick="s.active.exercises.push({exerciseId:'${e.id}',sets:workoutSets('${e.id}')});save();closeM();render()">Add</button></div>`).join('')}
function finish(){if(!s.active.exercises.length)return alert('Add at least one exercise.');if(s.active.exercises.some(e=>!e.sets.length||e.sets.some(x=>!x.done)))return alert('Log every set before finishing, or swipe left to remove sets you skipped.');for(let ei=0;ei<s.active.exercises.length;ei++)for(let si=0;si<s.active.exercises[ei].sets.length;si++){s.active.exercises[ei].sets[si].pr=setPR(ei,si);s.active.exercises[ei].sets[si].volumePR=setPR(ei,si,'volume')}s.active.end=new Date().toISOString();s.workouts.push(JSON.parse(JSON.stringify(s.active)));s.active=null;save();haptic('finish');render();feedback('Workout saved ✓')}

function history(){return `<div class="between" style="margin-top:28px"><h2>Workout history</h2><span class="pill">${s.workouts.length}</span></div>${s.workouts.length?s.workouts.slice().reverse().map(w=>`<div class="card between"><div><b>${esc(w.name)}</b><div class="muted">${new Date(w.start).toLocaleDateString()} · ${sets(w)} sets</div></div><button class="btn" onclick="view('${w.id}')">View</button></div>`).join(''):'<div class="card muted">No workouts yet. Import Hevy history in Settings.</div>'}`}
function view(id){const w=s.workouts.find(x=>x.id===id);modal(`<h2>${esc(w.name)}</h2><p class="muted">${new Date(w.start).toLocaleString()}</p>${w.exercises.map(e=>`<div class="card"><b>${esc(ex(e.exerciseId).name)}</b>${e.sets.map((x,i)=>`<div class="between" style="padding:7px 0"><span>${isWarmup(x)?'Warmup ':'Set '}${setLabel(e,i)} ${x.volumePR?'<span class="pr-badge" title="Set volume PR">🏅</span>':''}</span><b>${x.weight||'—'} × ${x.reps||'—'}</b></div>`).join('')}</div>`).join('')}<button class="btn danger full" onclick="s.workouts=s.workouts.filter(x=>x.id!=='${w.id}');save();closeM();render()">Delete workout</button>`)}
function best(id){return Math.max(0,...s.workouts.flatMap(w=>w.exercises.filter(e=>e.exerciseId===id).flatMap(e=>e.sets.filter(x=>!isWarmup(x)).map(x=>+x.weight||0))))}
function exercises(){return `<div class="between"><h2>Exercise library</h2><button class="btn" onclick="newEx()">＋ New</button></div>${s.exercises.sort((a,b)=>a.name.localeCompare(b.name)).map(e=>`<div class="between" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><b>${esc(e.name)}</b><div class="muted">Best: ${best(e.id)||'—'} ${s.unit}</div></div></div>`).join('')}`}
function newEx(){const name=prompt('Exercise name');if(name?.trim()){s.exercises.push({id:uid(),name:name.trim()});save();render()}}
function progress(){const total=s.workouts.reduce((n,w)=>n+sets(w),0),volume=s.workouts.reduce((n,w)=>n+vol(w),0);return `<div class="between"><h2>Your progress</h2><button class="btn" onclick="dataTools()">Data</button></div><div class="statgrid"><div class="stat"><b>${s.workouts.length}</b><span>Workouts</span></div><div class="stat"><b>${total}</b><span>Sets</span></div><div class="stat"><b>${Math.round(volume).toLocaleString()}</b><span>${s.unit} volume</span></div></div>${exerciseTrends()}<h2>Records</h2>${s.exercises.filter(e=>best(e.id)).sort((a,b)=>best(b.id)-best(a.id)).map(e=>`<div class="between" style="padding:11px 0;border-bottom:1px solid var(--line)"><span>${esc(e.name)}</span><b style="color:var(--good)">${best(e.id)} ${s.unit}</b></div>`).join('')||'<p class="muted">No records yet.</p>'}`}

let trendRange='2',trendMetric='weight';
function setTrend(k,v){if(k==='range')trendRange=v;else trendMetric=v;render()}
function showTrendPoint(el){const chart=el.closest('.card');chart.querySelector('.trend-detail').textContent=el.getAttribute('data-detail');chart.querySelectorAll('circle').forEach(p=>p.setAttribute('fill',p===el?'#5de0b2':'#9ba8ff'))}
function exerciseTrends(){
 const end=new Date(),cutoff=new Date(end);cutoff.setMonth(cutoff.getMonth()-Number(trendRange||0));cutoff.setHours(0,0,0,0);
 const visible=s.workouts.filter(w=>new Date(w.start)<=end&&(trendRange==='all'||new Date(w.start)>=cutoff));
 const unit=trendMetric==='reps'?'reps':trendMetric==='volume'?s.unit+' volume':s.unit;

 const ranked=s.exercises.map(e=>({e,uses:visible.filter(w=>w.exercises.some(x=>x.exerciseId===e.id)).length})).filter(x=>x.uses).sort((a,b)=>b.uses-a.uses||a.e.name.localeCompare(b.e.name)).slice(0,6);
 return '<section style="margin-top:28px"><h2>Exercise progress</h2><p class="muted">Your six most-used exercises in this period. Tap a point for details.</p><div class="row" style="margin-bottom:16px"><label style="flex:1">Date range<select aria-label="Graph date range" onchange="setTrend(\'range\',this.value)" style="width:100%;margin-top:6px">'+[['1','Past month'],['2','Past 2 months'],['3','Past 3 months'],['6','Past 6 months'],['all','All time']].map(([v,l])=>'<option value="'+v+'" '+(trendRange===v?'selected':'')+'>'+l+'</option>').join('')+'</select></label><label style="flex:1">Metric<select aria-label="Graph metric" onchange="setTrend(\'metric\',this.value)" style="width:100%;margin-top:6px">'+[['weight','Top weight'],['reps','Total reps'],['volume','Volume']].map(([v,l])=>'<option value="'+v+'" '+(trendMetric===v?'selected':'')+'>'+l+'</option>').join('')+'</select></label></div>'+ (ranked.length?ranked.map(({e,uses})=>{
 const points=visible.map(w=>({date:new Date(w.start),values:w.exercises.filter(x=>x.exerciseId===e.id).flatMap(x=>x.sets).filter(x=>!isWarmup(x)&&Number.isFinite(+x.reps)&&+x.reps>0&&(trendMetric==='reps'||(x.weight!==''&&x.weight!=null&&Number.isFinite(+x.weight)&&+x.weight>=0))).map(x=>trendMetric==='reps'?+x.reps:trendMetric==='volume'?+x.weight*+x.reps:+x.weight)})).filter(p=>p.values.length&&Number.isFinite(+p.date)).map(p=>({date:p.date,value:trendMetric==='weight'?Math.max(...p.values):p.values.reduce((a,b)=>a+b,0)})).sort((a,b)=>a.date-b.date);
 if(!points.length)return '<div class="card"><b>'+esc(e.name)+'</b><p class="muted">No weighted sets logged yet.</p></div>';
 const W=360,H=170,L=43,R=16,T=18,B=32,minT=trendRange==='all'?+points[0].date:+cutoff,maxT=trendRange==='all'?+points.at(-1).date:+end,maxV=Math.max(1,...points.map(p=>p.value))*1.1;
 const x=p=>minT===maxT?(L+W-R)/2:L+(+p.date-minT)/(maxT-minT)*(W-L-R),y=v=>H-B-v/maxV*(H-T-B),date=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'}),fmt=v=>Number(v.toFixed(1)).toLocaleString();
 const grid=[0,.5,1].map(f=>{const v=maxV*f,yy=y(v);return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="#2b394d"/><text x="'+(L-7)+'" y="'+(yy+4)+'" text-anchor="end" fill="#95a4bb" font-size="10">'+fmt(v)+'</text>'}).join('');
 const line=points.map(p=>x(p)+','+y(p.value)).join(' ');
 const dots=points.map(p=>'<circle cx="'+x(p)+'" cy="'+y(p.value)+'" r="6" fill="#9ba8ff" tabindex="0" role="button" onclick="showTrendPoint(this)" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();showTrendPoint(this)}" data-detail="'+esc(p.date.toLocaleDateString()+': '+fmt(p.value)+' '+unit)+'" aria-label="'+esc(p.date.toLocaleDateString()+': '+fmt(p.value)+' '+unit)+'"><title>'+esc(p.date.toLocaleDateString()+': '+fmt(p.value)+' '+unit)+'</title></circle>').join('');
 return '<div class="card"><div class="between"><b>'+esc(e.name)+'</b><span class="muted">'+uses+' workouts</span></div><p class="muted" style="margin:6px 0">Latest: '+fmt(points.at(-1).value)+' '+unit+' · Best: '+fmt(Math.max(...points.map(p=>p.value)))+' '+unit+'</p><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(e.name+' '+trendMetric+' over time in '+unit)+'" style="width:100%;display:block">'+grid+'<polyline points="'+line+'" fill="none" stroke="#9ba8ff" stroke-width="2.5" stroke-linejoin="round"/>'+dots+'<text x="'+L+'" y="'+(H-8)+'" fill="#95a4bb" font-size="10">'+date(new Date(minT))+'</text>'+(points.length>1?'<text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" fill="#95a4bb" font-size="10">'+date(new Date(maxT))+'</text>':'')+'</svg><p class="trend-detail muted" aria-live="polite" style="font-size:13px;min-height:20px;margin:8px 0 0">Tap a point to see the date and value.</p>'+(points.length===1?'<p class="muted" style="font-size:12px;margin-bottom:0">Log another workout to see a trend.</p>':'')+'</div>';
 }).join(''):'<div class="card muted">No workouts in this period. Choose a wider date range, finish a workout, or import your Hevy CSV in Settings.</div>')+'</section>';
}

function dataTools(){modal('<div class="between"><h2>Move or back up data</h2><button class="btn" onclick="closeM()">Close</button></div><p class="muted">Your workouts, routines and active workout are saved on this device for this web address.</p><div class="card"><h3>Import workout CSV</h3><p class="muted">Choose a Hevy CSV export to add your workouts, exercises, weights and reps. Previously imported workouts are skipped.</p><div class="btn primary full file-picker"><span aria-hidden="true">Choose CSV file</span><input aria-label="Choose CSV file" type="file" accept=".csv,text/csv,application/vnd.ms-excel" onchange="importHevy(this.files[0]);this.value=\'\'"></div></div><button class="btn full" onclick="backup()">Export my data</button><div class="btn full file-picker" style="margin-top:12px"><span aria-hidden="true">Import backup</span><input aria-label="Import backup" type="file" accept=".json,application/json" onchange="restore(this.files[0]);this.value=\'\'"></div><p class="muted" style="font-size:13px">Export from the old app first, then import the file at the new address. Import replaces the data on this address.</p>')}
function settings(){modal(`<h2>Settings & data</h2><div class="card"><b>Import Hevy CSV</b><p class="muted">Imports title, timestamps, exercises, sets, weights, reps, notes and set types.</p><input type="file" accept=".csv,text/csv" onchange="importHevy(this.files[0])"></div><div class="card"><b>Backup</b><div class="row" style="margin-top:10px"><button class="btn" onclick="backup()">Export JSON</button><label class="btn">Import JSON<input type="file" accept=".json" style="display:none" onchange="restore(this.files[0])"></label></div></div><button class="btn full" onclick="s.unit=s.unit==='lbs'?'kg':'lbs';save();closeM();render()">Units: ${s.unit}</button><button class="btn danger full" style="margin-top:10px" onclick="if(confirm('Delete all Repbook data?')){s=seed();save();closeM();render()}">Reset all data</button>`)}
function csv(t){const out=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);if(r.some(Boolean))out.push(r);r=[];f=''}else f+=c}r.push(f);if(r.some(Boolean))out.push(r);return out}
async function importHevy(file){if(!file)return;try{const rows=csv(await file.text()),head=rows.shift().map(x=>x.replace(/^\ufeff/,'').trim()),idx=k=>head.indexOf(k);for(const k of ['title','start_time','exercise_title','weight_lbs','reps'])if(idx(k)<0)throw Error('Missing '+k);const map=new Map;for(const r of rows){const title=r[idx('title')],start=r[idx('start_time')],name=r[idx('exercise_title')];if(!name||!start)continue;const key=title+'|'+start;let w=map.get(key);if(!w){w={id:uid(),name:title||'Workout',start:new Date(start.replace(/^(\d{1,2}) ([A-Za-z]{3}) (\d{4}), (\d{1,2}):(\d{2})$/,'$2 $1, $3 $4:$5')).toISOString(),end:null,exercises:[],source:'hevy',importKey:key};map.set(key,w)}let ee=s.exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!ee){ee={id:uid(),name};s.exercises.push(ee)}let we=w.exercises.find(x=>x.exerciseId===ee.id);if(!we){we={exerciseId:ee.id,notes:idx('exercise_notes')>=0?r[idx('exercise_notes')]:'',sets:[]};w.exercises.push(we)}we.sets.push({id:uid(),weight:r[idx('weight_lbs')],reps:r[idx('reps')],type:idx('set_type')>=0?r[idx('set_type')]:'normal',done:true})}const existing=new Set(s.workouts.map(w=>w.importKey));let n=0;for(const [k,w] of map)if(!existing.has(k)){s.workouts.push(w);n++}s.workouts.sort((a,b)=>new Date(a.start)-new Date(b.start));save();closeM();render();alert('Imported '+n+' workouts.')}catch(e){alert('Import failed: '+e.message)}}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='repbook-backup.json';a.click()}
async function restore(file){if(!file)return;try{const d=JSON.parse(await file.text());if(!d.workouts||!d.exercises)throw Error('Not a Repbook backup');s=d;save();closeM();render()}catch(e){alert(e.message)}}

function appSourceSignature(doc){return [...doc.querySelectorAll('style,script:not([src]),meta[name="viewport"],meta[name="theme-color"]')].map(el=>el.outerHTML).join('\n')}
const loadedAppSignature=appSourceSignature(document);
let checkingAppUpdate=false,pendingAppUpdate=false,lastAppUpdateCheck=0;
function applyAppUpdate(){if(!pendingAppUpdate||document.visibilityState!=='visible')return;if(document.activeElement?.matches('input,textarea,select')||!$('modal').classList.contains('hidden'))return;try{save();const last=Number(sessionStorage.getItem('repbook-last-update')||0);if(Date.now()-last<15000)return;sessionStorage.setItem('repbook-last-update',String(Date.now()));location.reload()}catch{}}
async function checkAppUpdate(){if(checkingAppUpdate||document.visibilityState!=='visible')return;if(Date.now()-lastAppUpdateCheck<10000){applyAppUpdate();return}checkingAppUpdate=true;lastAppUpdateCheck=Date.now();try{const response=await fetch('./index.html?repbook-update='+Date.now(),{cache:'no-store'});if(!response.ok)return;const latest=new DOMParser().parseFromString(await response.text(),'text/html');if(latest.title==='Repbook'&&latest.querySelector('#page')&&appSourceSignature(latest)!==loadedAppSignature){pendingAppUpdate=true;applyAppUpdate()}}catch{}finally{checkingAppUpdate=false}}
addEventListener('pageshow',checkAppUpdate);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkAppUpdate()});
addEventListener('focus',checkAppUpdate);
document.addEventListener('focusout',()=>setTimeout(applyAppUpdate,100));


function selectFieldValue(event){const el=event.target;if(!el.matches('input[type="text"],input[type="search"],input:not([type]),textarea')||!el.value)return;try{el.select()}catch{}}
document.addEventListener('focusin',event=>{const el=event.target;requestAnimationFrame(()=>{if(document.activeElement===el)selectFieldValue(event)})});
document.addEventListener('click',selectFieldValue);



let tabSwipeGesture=null,tabTransitionBusy=false,tabTransitionToken=0;
const tabSwipeSurface=document.querySelector('.app');
function cleanTabSwipe(p){if(!p)return;p.preview?.remove();tabSwipeSurface.classList.remove('swipe-transition');p.page.style.transform='';p.page.style.willChange='';p.page.style.transition=''}
function previewTabSwipe(p,dx){const target=dx<0?'history':'workout';if(target===tab){p.preview?.remove();p.preview=null;p.target=null;return false}if(p.target!==target){p.preview?.remove();p.target=target;const el=document.createElement('div');el.className='tab-preview';el.setAttribute('aria-hidden','true');el.inert=true;el.innerHTML='<div class="page-content">'+(target==='workout'?workout():progress()+history())+'</div>';const padding=getComputedStyle(tabSwipeSurface);el.style.paddingTop=padding.paddingTop;el.style.paddingLeft=padding.paddingLeft;el.style.paddingRight=padding.paddingRight;el.style.top=tabSwipeSurface.scrollTop+'px';el.style.left='0px';el.style.width=tabSwipeSurface.clientWidth+'px';el.style.height=tabSwipeSurface.clientHeight+'px';tabSwipeSurface.appendChild(el);p.preview=el}return true}
function moveTabPages(p,dx){tabSwipeSurface.classList.add('swipe-transition');p.dx=dx;const allowed=previewTabSwipe(p,dx),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduced)return;const offset=allowed?dx:dx*.18;p.page.style.transform='translate3d('+offset+'px,0,0)';if(p.preview)p.preview.style.transform='translate3d('+((dx<0?p.width:-p.width)+dx)+'px,0,0)'}
async function settleTabSwipe(p,commit){if(!p)return;const token=++tabTransitionToken;tabTransitionBusy=true;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,sign=p.dx<0?-1:1;try{if(!reduced){const options={duration:commit?280:240,easing:'cubic-bezier(.22,.8,.25,1)',fill:'forwards'},animations=[p.page.animate([{transform:p.page.style.transform||'translate3d(0,0,0)'},{transform:'translate3d('+(commit?sign*p.width:0)+'px,0,0)'}],options)];if(p.preview)animations.push(p.preview.animate([{transform:p.preview.style.transform},{transform:'translate3d('+(commit?0:-sign*p.width)+'px,0,0)'}],options));await Promise.all(animations.map(x=>x.finished.catch(()=>{})));if(token!==tabTransitionToken)return;if(commit)p.page.style.visibility='hidden';animations.forEach(x=>x.cancel())}if(token!==tabTransitionToken)return;cleanTabSwipe(p);if(commit)go(p.target);p.page.style.visibility=''}finally{if(token===tabTransitionToken){cleanTabSwipe(p);p.page.style.visibility='';tabTransitionBusy=false}}}
tabSwipeSurface.addEventListener('touchstart',event=>{if(tabTransitionBusy)return;const blocked=event.target.closest('.swipe-shell,input,textarea,select,button,a,label,.dialog,svg[role="img"]');if(event.touches.length!==1||blocked||!$('modal').classList.contains('hidden')){tabSwipeGesture=null;return}const t=event.touches[0];tabSwipeGesture={x:t.clientX,y:t.clientY,time:Date.now(),axis:null,dx:0,page:$('page'),width:tabSwipeSurface.clientWidth};tabSwipeGesture.page.style.willChange='transform'},{passive:true});
tabSwipeSurface.addEventListener('touchmove',event=>{const p=tabSwipeGesture;if(!p)return;if(event.touches.length!==1){tabSwipeGesture=null;settleTabSwipe(p,false);return}const t=event.touches[0],dx=t.clientX-p.x,dy=t.clientY-p.y;if(!p.axis&&Math.max(Math.abs(dx),Math.abs(dy))>10)p.axis=Math.abs(dx)>Math.abs(dy)*1.5?'x':'y';if(p.axis==='x'){if(event.cancelable)event.preventDefault();moveTabPages(p,dx)}},{passive:false});
tabSwipeSurface.addEventListener('touchend',event=>{const p=tabSwipeGesture;tabSwipeGesture=null;if(!p)return;if(p.axis!=='x'){cleanTabSwipe(p);return}if(event.cancelable)event.preventDefault();setTapBlockedUntil=Date.now()+400;const dx=p.dx,duration=Math.max(1,Date.now()-p.time),commit=p.target&&p.target!==tab&&(Math.abs(dx)>p.width*.22||Math.abs(dx)>35&&Math.abs(dx)/duration>.45);settleTabSwipe(p,!!commit)},{passive:false});
tabSwipeSurface.addEventListener('touchcancel',()=>{const p=tabSwipeGesture;tabSwipeGesture=null;if(p)settleTabSwipe(p,false)},{passive:true});

if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));render();
</script></body></html>
